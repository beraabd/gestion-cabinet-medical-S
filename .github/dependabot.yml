version: 2
updates:
  # Maintain Python dependencies
  - package-ecosystem: "pip"
    directory: "/MediCAB/MediCaB-backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Maintain Angular dependencies
  - package-ecosystem: "npm"
    directory: "/MediCAB/MediCaB-frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Maintain GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
