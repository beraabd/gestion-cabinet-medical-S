name: 🚀 Feature Request
description: Suggest an idea or enhancement for MediCAB
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Share your proposal for a new feature or improvement for the MediCAB management system.
  - type: input
    id: title-input
    attributes:
      label: Feature Title
      placeholder: e.g. Export consultation invoice to PDF
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or user requirement?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
    validations:
      required: true
