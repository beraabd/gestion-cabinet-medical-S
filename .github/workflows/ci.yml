name: MediCAB CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-ci:
    name: Backend Lint & Check (Django)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: medicab_db
          MYSQL_ROOT_PASSWORD: rootpassword
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'MediCAB/MediCaB-backend/requirements.txt'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config
          python -m pip install --upgrade pip
          pip install -r MediCAB/MediCaB-backend/requirements.txt

      - name: Django System Check & Migrations Validation
        env:
          DJANGO_SECRET_KEY: 'ci-secret-key-for-testing-only'
          DJANGO_DEBUG: '1'
          DB_NAME: medicab_db
          DB_USER: root
          DB_PASSWORD: rootpassword
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
        run: |
          cd MediCAB/MediCaB-backend
          python manage.py check
          python manage.py makemigrations --check --dry-run

  frontend-ci:
    name: Frontend Build & Test (Angular)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'MediCAB/MediCaB-frontend/package-lock.json'

      - name: Install dependencies
        run: |
          cd MediCAB/MediCaB-frontend
          npm ci

      - name: Build Angular app
        run: |
          cd MediCAB/MediCaB-frontend
          npm run build -- --configuration production
